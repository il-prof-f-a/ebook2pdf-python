<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ebook2PDF</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main>
    <h1>📚 Ebook2PDF</h1>
    <p class="muted">Cattura ciò che è visibile nella scheda corrente e crea un PDF locale.</p>

    <label>Pagine da acquisire
      <input id="pages" type="number" min="1" value="10">
    </label>

    <label>Attesa dopo il cambio pagina (s)
      <input id="delay" type="number" min="0.2" step="0.1" value="1.5">
    </label>

    <label>Tentativi per pagina
      <input id="attempts" type="number" min="1" max="20" value="5">
    </label>

    <label>Soglia nitidezza rispetto alla baseline
      <input id="sharpness" type="number" min="0.1" max="1" step="0.05" value="0.70">
    </label>

    <div class="buttons">
      <button id="selectRegion">1. Seleziona area pagina</button>
      <button id="selectNext">2. Seleziona pulsante avanti</button>
    </div>

    <div class="statusbox">
      <div><strong>Area:</strong> <span id="regionStatus">non selezionata</span></div>
      <div><strong>Avanti:</strong> <span id="nextStatus">non selezionato</span></div>
    </div>

    <label class="check"><input id="checkDuplicates" type="checkbox" checked> controlla pagine duplicate</label>
    <label class="check"><input id="checkQuality" type="checkbox" checked> controlla caricamento/nitidezza</label>
    <label class="check"><input id="enableOcr" type="checkbox"> crea PDF ricercabile con OCR locale</label>

    <section id="ocrOptions" class="ocrbox hidden">
      <label>Lingua OCR
        <select id="ocrLanguage">
          <option value="ita+eng" selected>Italiano + Inglese</option>
          <option value="ita">Italiano</option>
          <option value="eng">Inglese</option>
        </select>
      </label>
      <p class="muted compact">Tesseract.js viene eseguito localmente. Nessuna pagina viene inviata a servizi esterni.</p>
    </section>

    <div class="buttons">
      <button id="start" class="primary">▶ Avvia acquisizione</button>
      <button id="stop" disabled>■ Ferma</button>
    </div>

    <div id="stepText" class="step">Pronto.</div>
    <progress id="progress" value="0" max="1"></progress>
    <div id="progressText">Pronto.</div>

    <section id="ocrProgressBox" class="ocrprogress hidden">
      <div><strong>OCR</strong></div>
      <progress id="ocrProgress" value="0" max="1"></progress>
      <div id="ocrProgressText">In attesa.</div>
    </section>

    <pre id="log"></pre>
  </main>
  <script src="ocr.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
